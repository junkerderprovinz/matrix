# Pushes the README to the Docker Hub Overview on demand. build.yml does the same
# after every image push; this run builds nothing, so a failing sync can be traced
# to the credential alone.
name: Docker Hub description

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sync:
    name: Sync README to Docker Hub
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v5

      # Ungated, unlike build.yml, so a missing secret or a refused login turns
      # the run red.
      - name: Sync README to Docker Hub
        uses: peter-evans/dockerhub-description@1b9a80c056b620d92cedb9d9b5a223409c68ddfa # v5
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: ${{ vars.DOCKERHUB_USERNAME }}/matrix
          short-description: "Matrix Synapse homeserver plus the Element web client, one container for Unraid."
          enable-url-completion: true
