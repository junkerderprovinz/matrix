# =============================================================================
# build.yml — Matrix All-in-One Docker Image Build & Push
#
# Triggers:
#   - Hourly cron: checks for new Synapse releases and builds if needed
#   - workflow_dispatch: manual trigger (optionally force-rebuild)
#   - push to main: always builds and pushes latest
#
# Output: multi-arch image (linux/amd64, linux/arm64) pushed to
#         ghcr.io/junkerderprovinz/matrix — and, once the DOCKERHUB_USERNAME
#         variable + DOCKERHUB_TOKEN secret are set together, mirrored to
#         docker.io/<DOCKERHUB_USERNAME>/matrix — with tags:
#           :latest
#           :v1.x.y       (full Synapse version tag)
#           :1.x.y        (without leading 'v')
# =============================================================================

name: Build & Push Docker Image

on:
  # Run every hour to catch new Synapse releases
  schedule:
    - cron: '0 * * * *'

  # Allow manual re-runs from the GitHub Actions UI
  workflow_dispatch:
    inputs:
      force_rebuild:
        description: 'Force rebuild even if image already exists for this tag'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'

  # Build on every push to main (e.g. after updating Dockerfile or scripts)
  push:
    branches:
      - main
    paths-ignore:
      - '**.md'
      - 'LICENSE'
      - 'unraid-template.xml'

permissions:
  contents: read
  packages: write
  # Required to upload the Trivy SARIF report to the repo's Security tab
  security-events: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ghcr.io/junkerderprovinz/matrix
  # Whether the Docker Hub mirror is fully configured. Evaluated once here because
  # `secrets` is not available in a step-level `if:` — only the variable would be
  # readable there, which is exactly the half-check that let a rotated token take
  # the whole job down.
  DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME }}
  DOCKERHUB_READY: ${{ vars.DOCKERHUB_USERNAME != '' && secrets.DOCKERHUB_TOKEN != '' }}
  # NOTE: component versions (Element Web, Ketesa, s6-overlay) are pinned in the
  # Dockerfile ARGs and deliberately NOT repeated here. They used to be listed as
  # build-args below, which silently overrode the Dockerfile and meant Renovate
  # (whose custom managers match the Dockerfile ARG lines) bumped values that
  # never reached the published image. Synapse is the one exception: it is
  # resolved to the latest upstream release at build time, see the step below.
  # Opt into Node.js 24 for all JavaScript actions to silence the
  # deprecation warning about Node.js 20. Safe — runner already ships
  # Node 24, the actions run on it without code changes.
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  build-and-push:
    name: Build & Push
    runs-on: ubuntu-latest

    steps:
      # -----------------------------------------------------------------------
      # Checkout
      # -----------------------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # -----------------------------------------------------------------------
      # Determine the latest Synapse release tag
      # -----------------------------------------------------------------------
      - name: Get latest Synapse release tag
        id: synapse
        env:
          # Authenticated requests get 5000 req/h instead of 60 — essential
          # for hourly schedule runs sharing a GitHub-Actions egress IP pool.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG=""
          for attempt in 1 2 3 4 5; do
            TAG=$(curl -fsSL --max-time 15 \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              "https://api.github.com/repos/element-hq/synapse/releases/latest" \
              | jq -r '.tag_name' 2>/dev/null) || TAG=""
            if [ -n "${TAG}" ] && [ "${TAG}" != "null" ]; then
              break
            fi
            echo "::warning::Attempt ${attempt}: empty/null tag, retrying in $((attempt * 5))s"
            sleep $((attempt * 5))
          done

          if [ -z "${TAG}" ] || [ "${TAG}" = "null" ]; then
            echo "::error::Could not determine latest Synapse release tag after 5 attempts."
            exit 1
          fi

          # Strip leading 'v' for the version-without-v tag
          TAG_BARE="${TAG#v}"

          echo "tag=${TAG}"      >> "${GITHUB_OUTPUT}"
          echo "tag_bare=${TAG_BARE}" >> "${GITHUB_OUTPUT}"
          echo "Synapse latest release: ${TAG}"

      # -----------------------------------------------------------------------
      # Check whether we have already published an image for this exact tag.
      # If so, skip the build (unless force_rebuild=true or it's a push event).
      # -----------------------------------------------------------------------
      - name: Check if image already exists
        id: check
        run: |
          TAG="${{ steps.synapse.outputs.tag }}"
          IMAGE="${{ env.IMAGE_NAME }}:${TAG}"

          SKIP="false"
          FORCE="${{ github.event.inputs.force_rebuild }}"
          EVENT="${{ github.event_name }}"

          if [ "${EVENT}" = "push" ]; then
            echo "Push event — always rebuilding."
            SKIP="false"
          elif [ "${FORCE}" = "true" ]; then
            echo "Force rebuild requested — skipping existence check."
            SKIP="false"
          else
            # Skip only when the tag exists on EVERY registry we publish to. Checking
            # GHCR alone meant that turning the Docker Hub mirror on later, for a tag
            # GHCR already had, made scheduled runs skip forever and Hub stayed empty —
            # while the CA template points users at the Hub image. A missing tag on
            # either side is a reason to build.
            # docker manifest inspect returns 0 if the manifest exists.
            MISSING=""
            if ! docker manifest inspect "${IMAGE}" > /dev/null 2>&1; then
              MISSING="${MISSING} ${IMAGE}"
            fi
            if [ "${DOCKERHUB_READY}" = "true" ]; then
              DH_IMAGE="docker.io/${DOCKERHUB_USERNAME}/matrix:${TAG}"
              if ! docker manifest inspect "${DH_IMAGE}" > /dev/null 2>&1; then
                MISSING="${MISSING} ${DH_IMAGE}"
              fi
            fi

            if [ -z "${MISSING}" ]; then
              echo "Image exists on every configured registry — skipping build."
              SKIP="true"
            else
              echo "Missing on:${MISSING} — will build."
              SKIP="false"
            fi
          fi

          echo "skip=${SKIP}" >> "${GITHUB_OUTPUT}"

      # -----------------------------------------------------------------------
      # Authenticate to GitHub Container Registry
      # -----------------------------------------------------------------------
      - name: Log in to GHCR
        if: steps.check.outputs.skip != 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # -----------------------------------------------------------------------
      # Docker Hub mirror — active only once DOCKERHUB_USERNAME (variable) and
      # DOCKERHUB_TOKEN (secret) are set together; otherwise skipped (GHCR-only).
      # -----------------------------------------------------------------------
      # Both halves are required, not just the variable: with the variable set and
      # the secret missing or rotated, login-action fails, and because this step is
      # not optional that failure takes the whole job down — including the GHCR push
      # that was working. Gating on both makes a missing secret skip the mirror
      # instead of breaking the build.
      - name: Log in to Docker Hub
        if: steps.check.outputs.skip != 'true' && env.DOCKERHUB_READY == 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # -----------------------------------------------------------------------
      # Set up QEMU for multi-arch emulation (required for arm64 builds)
      # -----------------------------------------------------------------------
      - name: Set up QEMU
        if: steps.check.outputs.skip != 'true'
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4

      # -----------------------------------------------------------------------
      # Set up Docker Buildx for multi-platform builds
      # -----------------------------------------------------------------------
      - name: Set up Docker Buildx
        if: steps.check.outputs.skip != 'true'
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4

      # -----------------------------------------------------------------------
      # Build the tag list: GHCR always, Docker Hub only when mirroring is on.
      # -----------------------------------------------------------------------
      - name: Compose image tags
        id: tags
        if: steps.check.outputs.skip != 'true'
        env:
          SYN_TAG: ${{ steps.synapse.outputs.tag }}
          SYN_TAG_BARE: ${{ steps.synapse.outputs.tag_bare }}
        run: |
          {
            echo "tags<<EOF"
            echo "${IMAGE_NAME}:latest"
            echo "${IMAGE_NAME}:${SYN_TAG}"
            echo "${IMAGE_NAME}:${SYN_TAG_BARE}"
            # Gate on DOCKERHUB_READY, not the username alone: the login step now
            # skips when the token is missing, and emitting Hub tags for a registry
            # we never logged into would fail the push instead of skipping the mirror.
            if [ "${DOCKERHUB_READY}" = "true" ]; then
              DH="docker.io/${DOCKERHUB_USERNAME}/matrix"
              echo "${DH}:latest"
              echo "${DH}:${SYN_TAG}"
              echo "${DH}:${SYN_TAG_BARE}"
            fi
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      # -----------------------------------------------------------------------
      # Smoke-test gate (amd64): build the image, boot it against a throwaway
      # PostgreSQL, and require Synapse's /health to answer before anything is
      # pushed. A green Docker build only proves the image *builds* — this
      # proves the container actually *starts* (catches an s6 / config-gen /
      # Synapse boot crash before :latest, including the hourly auto-builds).
      # amd64-only on purpose: Synapse's first-run key generation + migrations
      # are too slow under arm64 QEMU emulation for a CI gate.
      #
      # arm64 is not left unchecked, though. The Dockerfile runs
      # `ldd /usr/local/bin/mas-cli && mas-cli --version` as a build step, which
      # executes once per target platform during the multi-arch build below. A
      # MAS binary that cannot resolve its shared libraries on arm64 therefore
      # fails the push rather than reaching a user — which was the one arch-
      # specific risk in pulling a binary from a foreign base image.
      # -----------------------------------------------------------------------
      - name: Build amd64 image for smoke test
        if: steps.check.outputs.skip != 'true'
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          platforms: linux/amd64
          push: false
          load: true
          tags: matrix:smoke-amd64
          build-args: |
            SYNAPSE_VERSION=${{ steps.synapse.outputs.tag }}
          cache-from: type=gha

      - name: Smoke test — amd64 must boot and serve /health
        if: steps.check.outputs.skip != 'true'
        run: |
          set -euo pipefail
          docker network create mx-smoke-net
          # Synapse requires the database to use the C collation; the stock
          # postgres image defaults to a libc locale, so pin it via initdb args.
          docker run -d --name mx-smoke-pg --network mx-smoke-net \
            -e POSTGRES_USER=synapse -e POSTGRES_PASSWORD=smoke \
            -e POSTGRES_DB=synapse \
            -e POSTGRES_INITDB_ARGS="--encoding=UTF-8 --lc-collate=C --lc-ctype=C" \
            postgres:16-alpine
          docker run -d --name mx-smoke --network mx-smoke-net -p 8008:8008 \
            -e SERVER_NAME=smoke.local \
            -e POSTGRES_HOST=mx-smoke-pg -e POSTGRES_USER=synapse \
            -e POSTGRES_PASSWORD=smoke -e POSTGRES_DB=synapse \
            matrix:smoke-amd64
          cleanup() {
            docker rm -f mx-smoke mx-smoke-pg >/dev/null 2>&1 || true
            docker network rm mx-smoke-net >/dev/null 2>&1 || true
          }
          # First boot generates config + signing keys and runs DB migrations —
          # give it a generous budget.
          for i in $(seq 1 180); do
            if curl -fsS -o /dev/null http://localhost:8008/health; then
              echo "✅ Synapse /health responded after ${i}s"
              # Liveness alone is not enough: Synapse answers /health on its SQLite
              # fallback too. Assert it actually loaded homeserver-overrides.yaml and
              # is on PostgreSQL — this is exactly the regression that shipped in
              # v2.1.0/2.1.1 (issue #3), where the override --config-path was dropped
              # and Synapse silently ran on SQLite with every override dead.
              if docker exec mx-smoke sh -c '[ -f /data/homeserver.db ]'; then
                echo "❌ /data/homeserver.db exists — Synapse fell back to SQLite (overrides not loaded)"
                docker logs mx-smoke || true
                cleanup; exit 1
              fi
              TABLES=$(docker exec -e PGPASSWORD=smoke mx-smoke-pg \
                psql -h 127.0.0.1 -U synapse -d synapse -tAc \
                "SELECT count(*) FROM information_schema.tables WHERE table_schema='public'" \
                2>/dev/null | tr -d '[:space:]') || TABLES=""
              if [ -z "${TABLES}" ] || [ "${TABLES}" = "0" ]; then
                echo "❌ throwaway PostgreSQL has no Synapse tables — Synapse is not using PostgreSQL"
                docker logs mx-smoke || true
                cleanup; exit 1
              fi
              echo "✅ Synapse is on PostgreSQL (${TABLES} public tables, no SQLite db)"
              # The opt-in contract: with AUTH_ENABLED unset, the rendered Synapse
              # config must look exactly as it did before MAS existed. Not
              # "delegation disabled" — absent. This is the assertion that protects
              # every existing install from an unattended image update.
              if docker exec mx-smoke grep -q "matrix_authentication_service" /data/homeserver-overrides.yaml; then
                echo "❌ MAS config leaked into the overrides with AUTH_ENABLED unset"
                docker exec mx-smoke cat /data/homeserver-overrides.yaml || true
                cleanup; exit 1
              fi
              if ! docker exec mx-smoke grep -q "^experimental_features: {}$" /data/homeserver-overrides.yaml \
                 || ! docker exec mx-smoke grep -q "^enable_registration:" /data/homeserver-overrides.yaml; then
                echo "❌ overrides differ from the pre-MAS shape with AUTH_ENABLED unset"
                docker exec mx-smoke cat /data/homeserver-overrides.yaml || true
                cleanup; exit 1
              fi
              if docker exec mx-smoke sh -c 'netstat -tln 2>/dev/null | grep -q ":8090 "'; then
                echo "❌ MAS is listening on 8090 although AUTH_ENABLED is unset"
                cleanup; exit 1
              fi
              echo "✅ MAS is inert (no config, no listener) with AUTH_ENABLED unset"
              cleanup
              exit 0
            fi
            if [ -z "$(docker ps -q --filter name=mx-smoke$)" ]; then
              echo "❌ container exited early — logs:"; docker logs mx-smoke || true
              cleanup; exit 1
            fi
            sleep 1
          done
          echo "❌ /health did not respond within 180s — logs:"
          docker logs mx-smoke || true
          cleanup
          exit 1

      # -----------------------------------------------------------------------
      # Second smoke gate: delegated auth ON.
      #
      # The first gate proves the default (MAS off) path. This one proves the
      # opt-in actually works, because a feature nobody can boot is worse than no
      # feature. It asserts the three things Element checks before it will offer
      # QR code login, so a regression here is caught in CI rather than by a user
      # staring at a greyed-out button:
      #   - Synapse serves /_matrix/client/v1/auth_metadata (only exists under MAS)
      #   - that metadata advertises the device_code grant
      #   - /_matrix/client/versions advertises org.matrix.msc4108
      # -----------------------------------------------------------------------
      - name: Smoke test — delegated auth (AUTH_ENABLED=true) must boot and offer QR login
        if: steps.check.outputs.skip != 'true'
        run: |
          set -euo pipefail
          cleanup() {
            docker rm -f mx-auth mx-auth-pg >/dev/null 2>&1 || true
            docker network rm mx-auth-net >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          docker network create mx-auth-net
          docker run -d --name mx-auth-pg --network mx-auth-net \
            -e POSTGRES_USER=synapse -e POSTGRES_PASSWORD=smoke \
            -e POSTGRES_DB=synapse \
            -e POSTGRES_INITDB_ARGS="--encoding=UTF-8 --lc-collate=C --lc-ctype=C" \
            postgres:16-alpine
          # MAS needs its own, empty database — it cannot share Synapse's.
          for i in $(seq 1 60); do
            if docker exec -e PGPASSWORD=smoke mx-auth-pg pg_isready -h 127.0.0.1 -U synapse >/dev/null 2>&1; then break; fi
            sleep 1
          done
          docker exec -e PGPASSWORD=smoke mx-auth-pg psql -h 127.0.0.1 -U synapse -d postgres \
            -c "CREATE DATABASE mas TEMPLATE template0 ENCODING 'UTF8' LC_COLLATE 'C' LC_CTYPE 'C';"
          docker run -d --name mx-auth --network mx-auth-net -p 18008:8008 -p 18090:8090 \
            -e SERVER_NAME=smoke.local \
            -e POSTGRES_HOST=mx-auth-pg -e POSTGRES_USER=synapse \
            -e POSTGRES_PASSWORD=smoke -e POSTGRES_DB=synapse \
            -e AUTH_ENABLED=true \
            -e AUTH_PUBLIC_BASE=https://auth.smoke.local/ \
            -e AUTH_POSTGRES_DB=mas \
            matrix:smoke-amd64
          for i in $(seq 1 180); do
            if curl -fsS -o /dev/null http://localhost:18008/health; then
              echo "✅ Synapse /health responded after ${i}s (delegated auth)"
              break
            fi
            if [ -z "$(docker ps -q --filter name=mx-auth$)" ]; then
              echo "❌ container exited early — logs:"; docker logs mx-auth || true; exit 1
            fi
            sleep 1
          done
          # MAS itself
          for i in $(seq 1 60); do
            if curl -fsS -o /dev/null http://localhost:18090/.well-known/openid-configuration; then
              echo "✅ MAS discovery served after ${i}s"; break
            fi
            [ "$i" = "60" ] && { echo "❌ MAS never served its discovery document"; docker logs mx-auth || true; exit 1; }
            sleep 1
          done
          curl -fsS http://localhost:18090/.well-known/openid-configuration \
            | grep -q 'urn:ietf:params:oauth:grant-type:device_code' \
            || { echo "❌ MAS does not advertise the device_code grant — QR login cannot work"; exit 1; }
          echo "✅ MAS advertises the device_code grant"
          # Synapse-side discovery, the endpoint Element actually asks
          curl -fsS http://localhost:18008/_matrix/client/v1/auth_metadata | grep -q '"issuer"' \
            || { echo "❌ /_matrix/client/v1/auth_metadata missing — auth is not delegated"; exit 1; }
          echo "✅ Synapse serves auth_metadata"
          curl -fsS http://localhost:18008/_matrix/client/versions | grep -q '"org.matrix.msc4108":true' \
            || { echo "❌ org.matrix.msc4108 not advertised — Element would grey out the QR button"; exit 1; }
          echo "✅ Synapse advertises org.matrix.msc4108"
          # MAS really used its own database, and did not touch Synapse's
          MAS_TABLES=$(docker exec -e PGPASSWORD=smoke mx-auth-pg psql -h 127.0.0.1 -U synapse -d mas -tAc \
            "SELECT count(*) FROM information_schema.tables WHERE table_schema='public'" | tr -d '[:space:]')
          [ -n "${MAS_TABLES}" ] && [ "${MAS_TABLES}" != "0" ] \
            || { echo "❌ MAS created no tables in its own database"; exit 1; }
          echo "✅ MAS migrated its own database (${MAS_TABLES} tables)"
          # Secrets must survive a restart, or every issued token dies on reboot
          BEFORE=$(docker exec mx-auth sha256sum /data/mas/encryption.secret /data/mas/keys/rsa.key)
          docker restart mx-auth >/dev/null
          for i in $(seq 1 180); do
            curl -fsS -o /dev/null http://localhost:18008/health && break
            sleep 1
          done
          AFTER=$(docker exec mx-auth sha256sum /data/mas/encryption.secret /data/mas/keys/rsa.key)
          [ "${BEFORE}" = "${AFTER}" ] \
            || { echo "❌ MAS secrets were regenerated on restart — every encrypted value would be lost"; exit 1; }
          echo "✅ MAS secrets persisted across a restart"

      # -----------------------------------------------------------------------
      # Third smoke gate: the syn2mas migration.
      #
      # This is the only irreversible thing the image can do to a user's data, so
      # it gets the most demanding test: create a real account under plain
      # Synapse auth, prove it can log in, migrate it, and then prove the SAME
      # PASSWORD still works against the auth service afterwards.
      #
      # That last assertion is the one that matters. A migration that "succeeds"
      # while leaving password hashes unusable would look perfectly fine in the
      # logs and lock every user out of their account — it is exactly what
      # happens if the bcrypt scheme is missing from the MAS config.
      # -----------------------------------------------------------------------
      - name: Smoke test — syn2mas must migrate accounts and keep passwords working
        if: steps.check.outputs.skip != 'true'
        run: |
          set -euo pipefail
          cleanup() {
            docker rm -f mx-mig mx-mig-pg >/dev/null 2>&1 || true
            docker volume rm mx-mig-data >/dev/null 2>&1 || true
            docker network rm mx-mig-net >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          docker network create mx-mig-net
          docker volume create mx-mig-data >/dev/null
          docker run -d --name mx-mig-pg --network mx-mig-net \
            -e POSTGRES_USER=synapse -e POSTGRES_PASSWORD=smoke \
            -e POSTGRES_DB=synapse \
            -e POSTGRES_INITDB_ARGS="--encoding=UTF-8 --lc-collate=C --lc-ctype=C" \
            postgres:16-alpine
          for i in $(seq 1 60); do
            docker exec mx-mig-pg pg_isready -h 127.0.0.1 -U synapse >/dev/null 2>&1 && break
            sleep 1
          done

          echo "--- phase 1: plain Synapse auth, create a real account ---"
          docker run -d --name mx-mig --network mx-mig-net -p 18108:8008 \
            -v mx-mig-data:/data \
            -e SERVER_NAME=smoke.local \
            -e POSTGRES_HOST=mx-mig-pg -e POSTGRES_USER=synapse \
            -e POSTGRES_PASSWORD=smoke -e POSTGRES_DB=synapse \
            -e ADMIN_USER=migtest -e ADMIN_PASSWORD='MigTest-2026!pw' \
            matrix:smoke-amd64
          for i in $(seq 1 180); do
            curl -fsS -o /dev/null http://localhost:18108/health && break
            if [ -z "$(docker ps -q --filter name=mx-mig$)" ]; then
              echo "❌ container exited"; docker logs mx-mig || true; exit 1
            fi
            sleep 1
          done
          # admin-bootstrap creates the account once Synapse answers
          for i in $(seq 1 90); do
            if curl -fsS -X POST http://localhost:18108/_matrix/client/v3/login \
                 -H 'Content-Type: application/json' \
                 -d '{"type":"m.login.password","identifier":{"type":"m.id.user","user":"migtest"},"password":"MigTest-2026!pw"}' \
                 2>/dev/null | grep -q access_token; then
              echo "✅ account logs in under plain Synapse auth (after ${i}s)"
              break
            fi
            [ "$i" = "90" ] && { echo "❌ account never became usable"; docker logs mx-mig || true; exit 1; }
            sleep 2
          done

          echo "--- phase 2: same volume, delegated auth + migration ---"
          docker rm -f mx-mig >/dev/null
          docker exec -e PGPASSWORD=smoke mx-mig-pg psql -h 127.0.0.1 -U synapse -d postgres \
            -c "CREATE DATABASE mas TEMPLATE template0 ENCODING 'UTF8' LC_COLLATE 'C' LC_CTYPE 'C';"
          docker run -d --name mx-mig --network mx-mig-net -p 18109:8008 -p 18190:8090 \
            -v mx-mig-data:/data \
            -e SERVER_NAME=smoke.local \
            -e POSTGRES_HOST=mx-mig-pg -e POSTGRES_USER=synapse \
            -e POSTGRES_PASSWORD=smoke -e POSTGRES_DB=synapse \
            -e AUTH_ENABLED=true -e AUTH_PUBLIC_BASE=https://auth.smoke.local/ \
            -e AUTH_POSTGRES_DB=mas -e AUTH_MIGRATE=true \
            matrix:smoke-amd64
          for i in $(seq 1 240); do
            curl -fsS -o /dev/null http://localhost:18109/health && break
            if [ -z "$(docker ps -q --filter name=mx-mig$)" ]; then
              echo "❌ container stopped during migration — logs:"; docker logs mx-mig || true; exit 1
            fi
            sleep 1
          done
          # Wait on STATE, not on output. The marker file is written straight to
          # the volume, while the banner still has to travel through the s6 logging
          # chain. Polling the banner alone kept losing that race: a run gave up
          # after 30s and the banner appeared 0.1s later, inside the very
          # `docker logs` call that printed the failure. The migration had been
          # done the whole time, only its announcement was still queued. So the
          # marker is asserted first and the banner second, by which point the log
          # has had its time.
          for i in $(seq 1 90); do
            docker exec mx-mig test -f /data/mas/.migrated 2>/dev/null && break
            if [ -z "$(docker ps -q --filter name=mx-mig$)" ]; then
              echo "❌ container stopped before the migration finished"; docker logs mx-mig || true; exit 1
            fi
            sleep 1
          done
          docker exec mx-mig test -f /data/mas/.migrated \
            || { echo "❌ migration marker not written — it would run again on next start"; docker logs mx-mig | tail -40 || true; exit 1; }
          echo "✅ migration marker written"
          found=0
          for i in $(seq 1 30); do
            if docker logs mx-mig 2>&1 | grep -q "ACCOUNTS MIGRATED"; then found=1; break; fi
            sleep 1
          done
          [ "$found" = "1" ] \
            || { echo "❌ migration finished but never announced it — the operator gets no signal"; docker logs mx-mig | tail -40 || true; exit 1; }
          echo "✅ migration ran and reported success"

          echo "--- phase 3: the account must still work, with the same password ---"
          for i in $(seq 1 60); do
            curl -fsS -o /dev/null http://localhost:18190/.well-known/openid-configuration && break
            sleep 1
          done
          TOKEN=""
          for i in $(seq 1 20); do
            TOKEN=$(curl -fsS -X POST http://localhost:18190/_matrix/client/v3/login \
              -H 'Content-Type: application/json' \
              -d '{"type":"m.login.password","identifier":{"type":"m.id.user","user":"migtest"},"password":"MigTest-2026!pw"}' \
              2>/dev/null | grep -o '"access_token":"[^"]*"' || true)
            [ -n "${TOKEN}" ] && break
            sleep 2
          done
          [ -n "${TOKEN}" ] \
            || { echo "❌ migrated account cannot log in — every user would be locked out"; docker logs mx-mig | tail -40 || true; exit 1; }
          echo "✅ migrated account logs in against the auth service with its original password"
          # A migration that accepts anything would pass the check above too
          CODE=$(curl -s -o /dev/null -w '%{http_code}' -X POST http://localhost:18190/_matrix/client/v3/login \
            -H 'Content-Type: application/json' \
            -d '{"type":"m.login.password","identifier":{"type":"m.id.user","user":"migtest"},"password":"definitely-not-the-password"}')
          [ "${CODE}" = "403" ] \
            || { echo "❌ wrong password returned ${CODE} instead of 403"; exit 1; }
          echo "✅ wrong passwords are still rejected"

          echo "--- phase 4: restarting must not migrate a second time ---"
          docker restart mx-mig >/dev/null
          for i in $(seq 1 180); do
            curl -fsS -o /dev/null http://localhost:18109/health && break
            sleep 1
          done
          # Give the second boot's output time to reach the log before counting,
          # for the same buffering reason as above.
          for i in $(seq 1 20); do
            docker logs mx-mig 2>&1 | grep -q "already migrated" && break
            sleep 1
          done
          COUNT=$(docker logs mx-mig 2>&1 | grep -c "ACCOUNTS MIGRATED" || true)
          [ "${COUNT}" = "1" ] \
            || { echo "❌ migration banner seen ${COUNT} times — it is not idempotent"; docker logs mx-mig | tail -30 || true; exit 1; }
          echo "✅ migration is idempotent across restarts"

      # -----------------------------------------------------------------------
      # Trivy CVE scan (non-blocking). Scans the locally-loaded amd64 smoke
      # image built above for HIGH/CRITICAL vulnerabilities and publishes the
      # findings to the repo's Security tab. Report-only: exit-code stays 0 so
      # it NEVER fails the build — this is a wrapper that tracks upstream
      # Synapse/Element/Debian, whose unfixed CVEs are not our regressions to
      # gate on (ignore-unfixed drops those with no available fix).
      # -----------------------------------------------------------------------
      - name: Scan image for CVEs (Trivy)
        if: steps.check.outputs.skip != 'true'
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: matrix:smoke-amd64
          format: sarif
          output: trivy-results.sarif
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "0"

      - name: Upload Trivy results to the Security tab
        if: steps.check.outputs.skip != 'true' && github.event_name != 'pull_request'
        uses: github/codeql-action/upload-sarif@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4
        with:
          sarif_file: trivy-results.sarif
          category: trivy

      # -----------------------------------------------------------------------
      # Build and push the multi-arch image
      # -----------------------------------------------------------------------
      - name: Build and push
        if: steps.check.outputs.skip != 'true'
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          # Supply-chain attestations: attach an SBOM and a provenance record to
          # the pushed image. Safe here because this is a single build-push (not a
          # push-by-digest + imagetools manifest merge, which needs digest-mode
          # handling for attestations).
          provenance: true
          sbom: true
          tags: ${{ steps.tags.outputs.tags }}
          build-args: |
            SYNAPSE_VERSION=${{ steps.synapse.outputs.tag }}
          # Use GitHub Actions cache to speed up subsequent builds
          cache-from: type=gha
          cache-to: type=gha,mode=max
          labels: |
            org.opencontainers.image.title=Matrix All-in-One
            org.opencontainers.image.description=Synapse + coturn + Element Web + Ketesa admin UI
            org.opencontainers.image.licenses=AGPL-3.0-only
            org.opencontainers.image.source=https://github.com/junkerderprovinz/matrix
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.synapse.outputs.tag }}

      # Mirror the GitHub README to the Docker Hub repo's Overview.
      #
      # This uses DOCKERHUB_TOKEN, the same access token the push above uses.
      # It used to use a separate DOCKERHUB_PASSWORD, on the belief that a push
      # token cannot edit a description. That was measured wrong on 2026-09-05:
      # an access token with read, write and delete scope edits it fine, while
      # the account password is refused outright with 401, because Docker Hub's
      # legacy login endpoint rejects a password once 2FA is on. One secret,
      # and the one that actually works.
      - name: Docker Hub description sync ready?
        id: dhdesc
        if: ${{ vars.DOCKERHUB_USERNAME != '' && github.event_name != 'pull_request' }}
        env:
          PW: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          if [ -n "$PW" ]; then
            echo "go=true" >> "$GITHUB_OUTPUT"
          else
            echo "DOCKERHUB_TOKEN not set — skipping Docker Hub description sync"
            echo "go=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Sync README to Docker Hub
        if: ${{ steps.dhdesc.outputs.go == 'true' }}
        uses: peter-evans/dockerhub-description@1b9a80c056b620d92cedb9d9b5a223409c68ddfa # v5
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: ${{ vars.DOCKERHUB_USERNAME }}/${{ github.event.repository.name }}
          short-description: "Matrix Synapse homeserver plus the Element web client, one container for Unraid."
          # The full README exceeds Docker Hub's 25000-byte description limit (it
          # gets truncated mid-page), so Docker Hub gets a condensed edition that
          # links back to GitHub for the full docs.
          readme-filepath: .github/DOCKERHUB.md
          enable-url-completion: true

      # -----------------------------------------------------------------------
      # Log a summary for easy visibility in the Actions UI
      # -----------------------------------------------------------------------
      - name: Build summary
        if: always()
        run: |
          if [ "${{ steps.check.outputs.skip }}" = "true" ]; then
            echo "### Skipped — image already up to date" >> "${GITHUB_STEP_SUMMARY}"
            echo "Tag: \`${{ steps.synapse.outputs.tag }}\`" >> "${GITHUB_STEP_SUMMARY}"
          else
            echo "### Published" >> "${GITHUB_STEP_SUMMARY}"
            echo "| Tag | Image |" >> "${GITHUB_STEP_SUMMARY}"
            echo "|-----|-------|" >> "${GITHUB_STEP_SUMMARY}"
            echo "| latest | \`${{ env.IMAGE_NAME }}:latest\` |" >> "${GITHUB_STEP_SUMMARY}"
            echo "| ${{ steps.synapse.outputs.tag }} | \`${{ env.IMAGE_NAME }}:${{ steps.synapse.outputs.tag }}\` |" >> "${GITHUB_STEP_SUMMARY}"
            echo "| ${{ steps.synapse.outputs.tag_bare }} | \`${{ env.IMAGE_NAME }}:${{ steps.synapse.outputs.tag_bare }}\` |" >> "${GITHUB_STEP_SUMMARY}"
          fi
